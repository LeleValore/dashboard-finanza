name: Aggiorna Dashboard Finanza

on:
  schedule:
    - cron: "0 6 * * *"   # ogni giorno alle 06:00 UTC (~8:00 in Italia)
  workflow_dispatch: {}    # permette anche l'avvio manuale dalla scheda Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 generate_report.py --no-browser

      - name: Prepara pagina per GitHub Pages
        run: |
          mkdir -p _site
          cp output/report.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
